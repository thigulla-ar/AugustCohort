[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentri-control-room"
version = "0.3.1"
description = "Local governance, audit, cost, and incident control room for hosted AI chat platforms"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "langgraph>=0.3,<2",
  "mcp[cli]>=1.9,<2",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["sentri"]
